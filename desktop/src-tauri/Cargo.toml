[package]
name = "dnd-syncer-desktop"
version = "0.1.0"
description = "Cross-platform DND and notification sync between Desktop and Android"
authors = ["DND Syncer Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
local-ip-address = "0.6"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
rand = "0.8"
hostname = "0.4"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS specific bindings if needed

[target.'cfg(target_os = "windows")'.dependencies]
# Windows specific bindings if needed

[target.'cfg(target_os = "linux")'.dependencies]
# Linux D-Bus / freedesktop
